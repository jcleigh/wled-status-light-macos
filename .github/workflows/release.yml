name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Build app
      run: |
        xcodebuild -project WLEDStatusLight.xcodeproj \
          -scheme WLEDStatusLight \
          -configuration Release \
          -archivePath "$PWD/build/WLEDStatusLight.xcarchive" \
          archive
    
    - name: Export app
      run: |
        xcodebuild -exportArchive \
          -archivePath "$PWD/build/WLEDStatusLight.xcarchive" \
          -exportPath "$PWD/build" \
          -exportOptionsPlist ExportOptions.plist
    
    - name: Ad-hoc sign the app
      run: |
        codesign --force --deep --sign - "build/WLEDStatusLight.app"
        codesign --verify --verbose "build/WLEDStatusLight.app"
    
    - name: Create DMG
      run: |
        # Create a temporary directory for DMG contents
        mkdir -p dmg
        cp -r build/WLEDStatusLight.app dmg/
        
        # Create a symlink to Applications folder
        ln -s /Applications dmg/Applications
        
        # Create DMG with more space for custom layout
        hdiutil create -volname "WLED Status Light" \
          -srcfolder dmg \
          -ov -format UDRW \
          -size 100m \
          "temp.dmg"
        
        # Mount the DMG
        hdiutil attach temp.dmg -mountpoint /Volumes/WLEDStatusLight
        
        # Set up the view options using AppleScript
        osascript <<EOF
        tell application "Finder"
          tell disk "WLEDStatusLight"
            open
            set current view of container window to icon view
            set toolbar visible of container window to false
            set statusbar visible of container window to false
            set the bounds of container window to {400, 100, 950, 500}
            set viewOptions to the icon view options of container window
            set arrangement of viewOptions to not arranged
            set icon size of viewOptions to 100
            set position of item "WLEDStatusLight.app" of container window to {140, 200}
            set position of item "Applications" of container window to {410, 200}
            set background picture of viewOptions to file ".background:background.png"
            close
            open
            update without registering applications
            delay 2
          end tell
        end tell
        EOF
        
        # Unmount the DMG
        hdiutil detach /Volumes/WLEDStatusLight
        
        # Convert to compressed read-only DMG
        hdiutil convert temp.dmg -format UDZO -o WLEDStatusLight.dmg
        rm temp.dmg
        
        # Sign the DMG
        codesign --force --sign - "WLEDStatusLight.dmg"
    
    - name: Upload DMG artifact
      uses: actions/upload-artifact@v4
      with:
        name: WLEDStatusLight-dmg
        path: WLEDStatusLight.dmg
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: WLEDStatusLight.dmg
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
