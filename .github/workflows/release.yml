name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Xcode 15.2
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: "15.2"
    
    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer
    
    - name: Build app
      run: |
        xcodebuild -project WLEDStatusLight.xcodeproj \
          -scheme WLEDStatusLight \
          -configuration Release \
          -archivePath "$PWD/build/WLEDStatusLight.xcarchive" \
          archive
    
    - name: Export app
      run: |
        xcodebuild -exportArchive \
          -archivePath "$PWD/build/WLEDStatusLight.xcarchive" \
          -exportPath "$PWD/build" \
          -exportOptionsPlist ExportOptions.plist
    
    - name: Create DMG
      run: |
        # Create a temporary directory for DMG contents
        mkdir -p dmg
        cp -r build/WLEDStatusLight.app dmg/
        
        # Create DMG
        hdiutil create -volname "WLED Status Light" \
          -srcfolder dmg \
          -ov -format UDZO \
          "WLEDStatusLight.dmg"
    
    - name: Upload DMG artifact
      uses: actions/upload-artifact@v4
      with:
        name: WLEDStatusLight-dmg
        path: WLEDStatusLight.dmg
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: WLEDStatusLight.dmg
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
